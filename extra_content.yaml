# Content selection for size-constrained builds (iOS ≤64 MB target).
# Omit a key (or set to null) to include everything in that category.
# Empty list [] includes nothing.
# Folders starting with "_" are always skipped.

# NOTE ON SIZE BUDGET
# Two hard limits, both checked at build time:
#   - ROM under 64 MiB (7 characters: 63.28 MiB, ~740 KB spare)
#   - save data under 32 KB SRAM (7 characters: 30,912 bytes; each extra
#     character costs ~281 bytes)
#
# Characters are the only large lever. The MIDI region (~14.8 MB) is Remix's
# own music and is not configurable from this file.
#
# Do NOT size a character by `du` on its folder: assets are vpk0-compressed and
# some files never ship, so real ROM cost is roughly 0.78x the folder size.
# Measured: Ken was 1.050 MB on disk but 0.821 MB in the ROM. At that ratio the
# characters below cost roughly:
#   Kazuya 0.56  MetaKnight 0.75  Ryu 0.76  Cloud 0.88  YZelda 0.93  Terry 1.06
# All 17 music packs together are only ~0.3 MB, so cutting music buys little.

# experiment/all-characters: with remix_music: vanilla (Remix MIDIs aliased,
# unused instrument samples dropped) these 16 fit with 13,800 bytes of ROM to
# spare. Not included: CBKnuckles, MKnuckles, CBMKnuckles (~0.9-1.1 MiB each).
characters:
  - Birdo
  - Cloud
  - DKUlt
  - Kazuya
  - Ken
  - Knuckles
  - MRGAW
  - MRGAWPLUS
  - MRGAWTHREED
  - MetaKnight
  - Rebecca
  - Ryu
  - Snake
  - Spiderman
  - Terry
  - YZelda

# Replace all Remix MIDIs with vanilla SSB tracks (frees ~3 MiB of ROM).
# "keep" (default) or "vanilla". EXTRA victory themes are unaffected.
remix_music: vanilla

# EXTRA stages omitted for size headroom.
stages: []

# All EXTRA music removed (~0.301 MB, 28 tracks across 17 packs).
#
# These tracks are not referenced by anything built here: with `stages: []` no
# stage assigns them as BGM, so their only remaining use is padding the
# random/toggle BGM pool in the music menu (2 of the 28 also work as menu
# music). Not worth the ROM space for this build.
#
# Set to `null` to restore all of them, or list pack names to restore some.
#
# CAUTION: if you re-enable any stage above, restore the music packs its
# config.yaml references (extra_stages/<Stage>/config.yaml -> music:) or the
# stage will point at track IDs that no longer exist.
music: []
